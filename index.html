<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenzora Cinematic Player</title>
    
    <style>
        :root {
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --primary-color: #ffffff;
            --secondary-color: #b3b3b3;
            --accent-color: #fff; /* For progress bar fill */
            --bg-overlay: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 50%, transparent 100%);
            --transition-speed: 0.3s;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: var(--font-family);
            overflow: hidden; /* Fullscreen cinematic experience */
            color: var(--primary-color);
        }

        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ensures video aspect ratio is maintained */
        }

        /* --- UI Overlays --- */
        
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to video */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 1;
            transition: opacity var(--transition-speed) ease;
        }

        .ui-layer.hidden {
            opacity: 0;
        }

        /* Top Bar */
        .top-bar {
            padding: 30px;
            pointer-events: auto;
        }
        .back-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .back-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        /* Center Play Button */
        .center-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.1s, background 0.2s;
        }
        .center-play:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: translate(-50%, -50%) scale(1.05);
        }
        .center-play svg {
            width: 48px;
            height: 48px;
            fill: white;
            margin-left: 5px; /* visually center play icon */
        }

        /* Bottom Controls Area */
        .bottom-controls {
            background: var(--bg-overlay);
            padding: 20px 40px 30px 40px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Metadata */
        .metadata {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }
        .show-logo {
            max-height: 80px;
            width: auto;
            object-fit: contain;
            margin-bottom: 5px;
            /* Placeholder styling if image fails */
            font-size: 24px;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .ep-title-row {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ep-number {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        .ep-desc {
            font-size: 13px;
            color: var(--secondary-color);
            max-width: 60%;
            line-height: 1.4;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.1s;
        }
        .progress-container:hover {
            height: 8px;
        }
        .progress-filled {
            height: 100%;
            background: var(--accent-color);
            border-radius: 3px;
            width: 0%;
            position: relative;
            pointer-events: none;
        }
        .progress-thumb {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 12px;
            height: 12px;
            background: var(--accent-color);
            border-radius: 50%;
            transition: transform 0.1s;
        }
        .progress-container:hover .progress-thumb {
            transform: translateY(-50%) scale(1);
        }

        /* Timestamps */
        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: var(--secondary-color);
            margin-top: -5px;
        }
        .time-left {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #fff;
        }
        .ep-badge {
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        /* Action Buttons Row */
        .actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .action-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .ctrl-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.85;
            transition: opacity 0.2s, transform 0.1s;
        }
        .ctrl-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        .ctrl-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* Volume Slider */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        /* Telemetry Overlay (Top Right) */
        .telemetry-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #aaa;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }
        .telemetry-box span {
            color: #fff;
            font-weight: bold;
        }
        
        /* Clickable video area */
        .video-click-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 150px);
            z-index: 1;
        }

        /* Toast Notification */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

    </style>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <!-- The actual video element -->
        <video id="videoElement" crossorigin playsinline></video>
        
        <!-- Clickable area to toggle play/pause -->
        <div class="video-click-area" id="videoClickArea"></div>

        <!-- Toast Notification -->
        <div class="toast" id="toast">Message</div>

        <!-- Top Right Stats -->
        <div class="telemetry-box" id="telemetryBox">
            <div>Peers: <span id="peersStat">0</span></div>
            <div>P2P: <span id="p2pStat" style="color:#10b981;">0 MB</span></div>
            <div>HTTP: <span id="httpStat" style="color:#f59e0b;">0 MB</span></div>
        </div>

        <!-- UI Overlay (Fades out) -->
        <div class="ui-layer" id="uiLayer">
            
            <div class="top-bar">
                <button class="back-btn">
                    <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                </button>
            </div>

            <!-- Shown only when paused -->
            <div class="center-play" id="centerPlayBtn">
                <svg viewBox="0 0 24 24" id="centerPlayIcon"><path d="M8 5v14l11-7z"/></svg>
            </div>

            <div class="bottom-controls">
                
                <div class="metadata">
                    <div class="show-logo">TENZORA</div>
                    <div class="ep-title-row">
                        <span class="ep-number">Episode 1</span>
                        <span>New Days</span>
                    </div>
                    <div class="ep-desc">Tempest is thriving after the success of its festival, but unexpected trouble has arisen with the new dungeon.</div>
                </div>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-filled" id="progressFilled">
                        <div class="progress-thumb"></div>
                    </div>
                </div>

                <div class="time-row">
                    <div class="time-left">
                        <span id="currentTime">0:00</span>
                        <span class="ep-badge">Ep 1 / 24</span>
                    </div>
                    <div class="time-right">
                        <span id="durationTime">24:10</span>
                    </div>
                </div>

                <div class="actions-row">
                    <div class="action-group">
                        <!-- Prev -->
                        <button class="ctrl-btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                        
                        <!-- Play/Pause -->
                        <button class="ctrl-btn" id="playPauseBtn">
                            <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        
                        <!-- Next -->
                        <button class="ctrl-btn" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                        
                        <!-- Volume -->
                        <div class="volume-container">
                            <button class="ctrl-btn" id="muteBtn">
                                <svg viewBox="0 0 24 24" id="volIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                        </div>
                    </div>
                    
                    <div class="action-group">
                        <!-- Episodes List -->
                        <button class="ctrl-btn" id="episodesBtn"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></button>
                        <!-- CC -->
                        <button class="ctrl-btn" id="ccBtn"><svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1.5c0 .28-.22.5-.5.5h-3c-.28 0-.5-.22-.5-.5v-4c0-.28.22-.5.5-.5h3c.28 0 .5.22.5.5V11zm6 0h-1.5v-.5h-2v3h2V13H17v1.5c0 .28-.22.5-.5.5h-3c-.28 0-.5-.22-.5-.5v-4c0-.28.22-.5.5-.5h3c.28 0 .5.22.5.5V11z"/></svg></button>
                        <!-- Audio Track -->
                        <button class="ctrl-btn" id="audioBtn"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></button>
                        <!-- Settings -->
                        <button class="ctrl-btn" id="settingsBtn"><svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></button>
                        <!-- PIP -->
                        <button class="ctrl-btn" id="pipBtn"><svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg></button>
                        <!-- Fullscreen -->
                        <button class="ctrl-btn" id="fsBtn"><svg viewBox="0 0 24 24" id="fsIcon"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- P2P Media Loader -->
    <script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-core@latest/build/p2p-media-loader-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@latest/build/p2p-media-loader-hlsjs.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById('videoElement');
            const source = 'https://tenzora-edge.hossainrafsan046.workers.dev/stream/BQACAgUAAxkBAAMCan2XJ8K1ze3wMK9JZMLljwJjSLsAAhwlAAJMbPBXFjvaeDBHp9w9BA';
            
            // UI Elements
            const uiLayer = document.getElementById('uiLayer');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const playIcon = document.getElementById('playIcon');
            const centerPlayBtn = document.getElementById('centerPlayBtn');
            const centerPlayIcon = document.getElementById('centerPlayIcon');
            const videoClickArea = document.getElementById('videoClickArea');
            const progressContainer = document.getElementById('progressContainer');
            const progressFilled = document.getElementById('progressFilled');
            const currentTimeEl = document.getElementById('currentTime');
            const durationTimeEl = document.getElementById('durationTime');
            const muteBtn = document.getElementById('muteBtn');
            const volIcon = document.getElementById('volIcon');
            const volumeSlider = document.getElementById('volumeSlider');
            const fsBtn = document.getElementById('fsBtn');
            const fsIcon = document.getElementById('fsIcon');
            const playerContainer = document.getElementById('playerContainer');

            // Icons SVG Data
            const SVG_PLAY = '<path d="M8 5v14l11-7z"/>';
            const SVG_PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            const SVG_VOL_HIGH = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            const SVG_VOL_MUTE = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            const SVG_FS_ENTER = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
            const SVG_FS_EXIT = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';

            let p2pBytes = 0;
            let httpBytes = 0;
            let hideControlsTimeout;

            // --- Setup P2P & HLS ---
            if (Hls.isSupported() && p2pml.hlsjs.Engine.isSupported()) {
                const engine = new p2pml.hlsjs.Engine();
                window.engine = engine; // Exposed for debugging
                
                const hls = new Hls({
                    liveSyncDurationCount: 7,
                    loader: engine.createLoaderClass()
                });

                p2pml.hlsjs.initHlsJsPlayer(hls);
                hls.loadSource(source);
                hls.attachMedia(video);

                // Stats
                let peerCount = 0;

                engine.on(p2pml.core.Events.PieceBytesDownloaded, (method, size) => {
                    if (method === "p2p") {
                        p2pBytes += size;
                        document.getElementById('p2pStat').innerText = (p2pBytes / 1024 / 1024).toFixed(2) + " MB";
                    } else if (method === "http") {
                        httpBytes += size;
                        document.getElementById('httpStat').innerText = (httpBytes / 1024 / 1024).toFixed(2) + " MB";
                    }
                });

                engine.on(p2pml.core.Events.PeerConnect, () => {
                    peerCount++;
                    document.getElementById('peersStat').innerText = peerCount;
                });
                
                engine.on(p2pml.core.Events.PeerClose, () => {
                    peerCount = Math.max(0, peerCount - 1);
                    document.getElementById('peersStat').innerText = peerCount;
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
            }

            // --- Player Controls Logic ---

            function togglePlay() {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }

            video.addEventListener('play', () => {
                playIcon.innerHTML = SVG_PAUSE;
                centerPlayBtn.style.display = 'none'; // Hide center play when playing
            });

            video.addEventListener('pause', () => {
                playIcon.innerHTML = SVG_PLAY;
                centerPlayIcon.innerHTML = SVG_PLAY;
                centerPlayBtn.style.display = 'flex'; // Show center play when paused
                uiLayer.classList.remove('hidden'); // Ensure UI stays visible when paused
            });

            playPauseBtn.addEventListener('click', togglePlay);
            centerPlayBtn.addEventListener('click', togglePlay);
            videoClickArea.addEventListener('click', togglePlay);

            // Time Formatting
            function formatTime(seconds) {
                if(isNaN(seconds)) return "0:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            video.addEventListener('loadedmetadata', () => {
                durationTimeEl.innerText = formatTime(video.duration);
            });

            video.addEventListener('timeupdate', () => {
                currentTimeEl.innerText = formatTime(video.currentTime);
                const percentage = (video.currentTime / video.duration) * 100;
                progressFilled.style.width = `${percentage}%`;
            });

            // Toast System
            const toastEl = document.getElementById('toast');
            let toastTimeout;
            function showToast(message) {
                if(!toastEl) return;
                toastEl.innerText = message;
                toastEl.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2000);
            }

            // Dummy Buttons
            document.getElementById('prevBtn')?.addEventListener('click', () => {
                video.currentTime = 0;
                showToast("Restarted episode");
            });
            document.getElementById('nextBtn')?.addEventListener('click', () => showToast("Next episode not available"));
            document.getElementById('episodesBtn')?.addEventListener('click', () => showToast("Episodes list coming soon"));
            document.getElementById('ccBtn')?.addEventListener('click', () => showToast("Subtitles unavailable"));
            document.getElementById('audioBtn')?.addEventListener('click', () => showToast("Language track selection coming soon"));
            document.getElementById('settingsBtn')?.addEventListener('click', () => showToast("Quality auto-managed by HLS"));
            
            // PIP Support
            const pipBtn = document.getElementById('pipBtn');
            if (pipBtn) {
                pipBtn.addEventListener('click', async () => {
                    try {
                        if (document.pictureInPictureElement) {
                            await document.exitPictureInPicture();
                        } else if (video.requestPictureInPicture) {
                            await video.requestPictureInPicture();
                        } else {
                            showToast("PIP not supported in this browser");
                        }
                    } catch (err) {
                        console.error(err);
                        showToast("PIP Error");
                    }
                });
            }

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case ' ':
                    case 'k':
                        e.preventDefault();
                        togglePlay();
                        break;
                    case 'f':
                        fsBtn.click();
                        break;
                    case 'm':
                        muteBtn.click();
                        break;
                    case 'arrowleft':
                        video.currentTime = Math.max(0, video.currentTime - 10);
                        showToast("Rewind 10s");
                        break;
                    case 'arrowright':
                        video.currentTime = Math.min(video.duration, video.currentTime + 10);
                        showToast("Fast forward 10s");
                        break;
                }
            });

            // Seeking with Drag
            let isDragging = false;
            
            function updateProgressFromEvent(e) {
                const rect = progressContainer.getBoundingClientRect();
                let pos = (e.clientX - rect.left) / rect.width;
                pos = Math.max(0, Math.min(1, pos));
                video.currentTime = pos * video.duration;
            }

            progressContainer.addEventListener('mousedown', (e) => {
                isDragging = true;
                updateProgressFromEvent(e);
            });
            document.addEventListener('mousemove', (e) => {
                if (isDragging) updateProgressFromEvent(e);
            });
            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Volume
            function updateVolumeIcon() {
                if (video.muted || video.volume === 0) {
                    volIcon.innerHTML = SVG_VOL_MUTE;
                } else {
                    volIcon.innerHTML = SVG_VOL_HIGH;
                }
            }

            muteBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                volumeSlider.value = video.muted ? 0 : video.volume;
                updateVolumeIcon();
            });

            volumeSlider.addEventListener('input', (e) => {
                video.volume = e.target.value;
                video.muted = e.target.value == 0;
                updateVolumeIcon();
            });

            // Fullscreen
            fsBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    playerContainer.requestFullscreen().catch(err => console.log(err));
                } else {
                    document.exitFullscreen();
                }
            });

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    fsIcon.innerHTML = SVG_FS_EXIT;
                } else {
                    fsIcon.innerHTML = SVG_FS_ENTER;
                }
            });

            // Auto-hide controls
            function resetControlsTimeout() {
                uiLayer.classList.remove('hidden');
                clearTimeout(hideControlsTimeout);
                
                // Only hide if playing
                if (!video.paused) {
                    hideControlsTimeout = setTimeout(() => {
                        uiLayer.classList.add('hidden');
                    }, 3000);
                }
            }

            document.addEventListener('mousemove', resetControlsTimeout);
            document.addEventListener('click', resetControlsTimeout);
            
            // Initial timeout
            resetControlsTimeout();
        });
    </script>
</body>
</html>
